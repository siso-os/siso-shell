{{!-- v2 · related: link cards lit on hover; kicker in the record's tone. Data: [{title,href,why,type,tone}] --}}
{{#if .}}<div class="links">{{#each .}}<a class="lk {{tone tone}}" href="{{href}}">{{#if type}}<span class="kk">{{type}}</span>{{/if}}<b>{{title}}</b>{{#if why}}<span>{{why}}</span>{{/if}}</a>{{/each}}</div>
{{else}}<div class="empty">Nothing related is linked from this record.</div>{{/if}}
